name: Actualizar heatmap

"on":
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar librerías
        run: pip install -r scripts/requirements.txt

      - name: Descargar contribuciones
        run: python scripts/fetch_contributions.py

      - name: Dibujar el heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          git diff --cached --quiet || git commit -m "chore: actualiza el mapa de contribuciones [skip ci]"
          git push